<!DOCTYPE html>
<html lang="en">
<head>

<meta property="og:url" content="https://inhabitedisland.github.io/scale-up/">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root {
  /* One gamebook page on a desk, with a steering-committee status strip pinned above it. Single light theme by choice. */
  --paper: #e9ebe6;
  --sheet: #fbfbf8;
  --ink: #161a24;
  --muted: #5a606e;
  --rule: #d3d6d0;
  --accent: #1b46c2;
  --mark: #ffd43b;
  --good: #1c7a4f;
  --warn: #b26700;
  --bad: #bd3226;
  --display: 'Big Shoulders Display', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --body: 'Literata', Georgia, 'Times New Roman', serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[data-focus]:focus { outline: none; }

/* ---------- status strip ---------- */
.status {
  position: relative; z-index: 5;
  background: var(--ink); color: #eef0f5;
  padding: 10px 16px 12px;
}
.status-in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: center; }
.brand { font-family: var(--display); font-weight: 800; font-size: 18px; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1.05; white-space: nowrap; }
.brand-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.hdr-toggle { background: transparent; border: 1px solid #59607a; border-radius: 3px; color: #cfd4e0; padding: 3px 8px; font-family: var(--display); font-weight: 600; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; }
.hdr-toggle:hover { border-color: var(--mark); color: #fff; }
.hdr-actions { grid-column: 1 / -1; display: flex; gap: 8px; margin: 2px 0 4px; }
.hdr-toggle:focus:not(:focus-visible) { outline: none; }
.hdr-toggle.confirm { border-color: var(--mark); background: var(--mark); color: var(--ink); }
.status.compact .detail { display: none !important; }
.status.compact .pb-val { font-size: 20px; }
.status.compact .pb-label { display: none; }

.brand small { display: block; font-weight: 600; font-size: 12px; letter-spacing: 0.12em; color: #9aa2b4; margin-top: 3px; }
.pb { text-align: right; line-height: 1.1; }
.pb-label { font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #9aa2b4; }
.pb-val { font-family: var(--display); font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; }
.pb-val.na { font-size: 18px; color: #9aa2b4; }
.pb-delta { display: inline-block; font-family: var(--display); font-weight: 600; font-size: 14px; margin-right: 8px; opacity: 0; transition: opacity 0.3s; font-variant-numeric: tabular-nums; }
.pb-delta.show { opacity: 1; }
.pb-delta.up { color: #ff8a7a; } .pb-delta.down { color: #7fe0ae; }
.track { grid-column: 1 / -1; position: relative; height: 8px; border-radius: 4px; background: #2c3242; }
.fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: #7fe0ae; transition: width 0.6s ease, background-color 0.6s; }
.fill.warn { background: #ffc86b; } .fill.bad { background: #ff8a7a; }
.track.na .fill { background: repeating-linear-gradient(45deg, #59607a 0 6px, #2c3242 6px 12px); }
.limit { position: absolute; top: -4px; bottom: -4px; width: 2px; background: #eef0f5; }
.limit span { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); font-family: var(--display); font-weight: 600; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #9aa2b4; white-space: nowrap; }
.money[hidden] { display: none; }
.pm-lock { grid-column: 1 / -1; margin: 14px 0 0; font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #9aa2b4; }
.pm-lock[hidden] { display: none; }
.money { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; margin-top: 18px; }
@media (min-width: 640px) { .money { grid-template-columns: repeat(4, 1fr); } }

.money .pm-l { display: block; }
.money .pm-l b { display: block; font-size: 15px; margin-top: 2px; letter-spacing: 0.04em; }
.pm { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 18px; }
.pm[hidden] { display: none; }
.pm-l { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #9aa2b4; margin-bottom: 4px; }
.pm-l b { font-size: 15px; color: #eef0f5; font-weight: 800; font-variant-numeric: tabular-nums; }
.pm-t { height: 6px; border-radius: 3px; background: #2c3242; overflow: hidden; }
.pm-f { height: 100%; border-radius: 3px; transition: width 0.6s ease, background-color 0.6s; }
.pm-f.good { background: #7fe0ae; } .pm-f.good.mid { background: #ffc86b; } .pm-f.good.low { background: #ff8a7a; }
.pm-f.risk { background: #7fe0ae; } .pm-f.risk.mid { background: #ffc86b; } .pm-f.risk.high { background: #ff8a7a; }
.pm-toggle { grid-column: 1 / -1; justify-self: start; margin-top: 8px; background: transparent; border: 1px solid #59607a; border-radius: 3px; color: #cfd4e0; padding: 4px 10px; font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; }
.pm-toggle:hover { border-color: var(--mark); color: #fff; }
.pm-toggle[hidden] { display: none; }
.unlock { border: 1.5px solid var(--ink); background: #fff6cf; border-radius: 3px; padding: 12px 14px; margin: 0 0 20px; font-size: 16px; }
.phases { grid-column: 1 / -1; list-style: none; margin: 20px 0 0; padding: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.phases li { font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #6f7790; border-top: 3px solid #2c3242; padding-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.phases li.done { color: #9aa2b4; border-color: #59607a; }
.phases li.now { color: #fff; border-color: var(--mark); }
.phases .sh { display: none; }

/* ---------- the page ---------- */
.scene { height: clamp(210px, 44vw, 400px); overflow: hidden; border-bottom: 3px solid var(--ink); background: var(--paper); }
.scene svg { display: block; width: 100%; height: 100%; animation: drift 0.5s ease-out; }
.scene img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center 25%; animation: drift 0.5s ease-out; }
@keyframes drift { from { opacity: 0.4; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .scene svg, .scene img { animation: none; } }
main { position: relative; max-width: 720px; margin: calc(-1 * clamp(70px, 15vw, 150px)) auto 0; padding: 0 16px 48px; }
.page {
  background: var(--sheet);
  border: 1px solid var(--rule);
  border-radius: 3px;
  box-shadow: 6px 6px 0 -1px var(--sheet), 6px 6px 0 0 var(--rule), 12px 12px 0 -1px var(--sheet), 12px 12px 0 0 var(--rule);
  padding: 22px 22px 26px;
  margin-right: 12px;
  animation: turn 0.28s ease-out;
}
@keyframes turn { from { transform: translateX(10px); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .page { animation: none; } .fill { transition: none; } }
.folio { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--rule); padding-bottom: 8px; margin-bottom: 18px; }
.pno { font-family: var(--display); font-weight: 800; font-size: 44px; line-height: 0.9; font-variant-numeric: tabular-nums; background: linear-gradient(transparent 58%, var(--mark) 58% 88%, transparent 88%); padding: 0 4px; }
.pno.word { font-size: 28px; letter-spacing: 0.04em; text-transform: uppercase; }
.when { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); text-align: right; }
.page h1, .page h2 { font-family: var(--display); font-weight: 800; text-transform: uppercase; letter-spacing: 0.01em; line-height: 0.95; text-wrap: balance; margin: 0 0 14px; }
.page h1 { font-size: clamp(40px, 9vw, 64px); }
.page h2 { font-size: clamp(32px, 7vw, 48px); }
.kicker { font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin: 0 0 10px; }
.lede { font-size: 19px; margin: 0 0 14px; }
.situation { font-size: 19px; margin: 0 0 20px; }
.fine { font-size: 14px; color: var(--muted); margin: 16px 0 0; }
p { margin: 0 0 12px; }

.speaker { display: flex; align-items: center; gap: 12px; margin: 0 0 12px; }
.av { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 17px; letter-spacing: 0.04em; background: hsl(var(--h) 55% 87%); color: hsl(var(--h) 55% 26%); }
.av svg { width: 24px; height: 24px; }
.who b { display: block; font-weight: 600; line-height: 1.2; }
.who span { font-size: 14px; color: var(--muted); }

.says { list-style: none; margin: 0 0 20px; padding: 0; display: grid; gap: 14px; }
.says li { border-left: 3px solid var(--rule); padding: 2px 0 2px 14px; }
.says .speaker { margin-bottom: 6px; }
.says p { margin: 0; font-size: 18px; }
.says li.narr { border-left-color: var(--mark); }
.says li.narr p { font-style: italic; }

.choices { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.choice {
  width: 100%; text-align: left; background: var(--sheet); border: 1.5px solid var(--ink); border-radius: 3px;
  padding: 12px 14px; display: grid; gap: 4px; transition: background-color 0.15s, transform 0.15s;
}
.choice:hover { background: #fff6cf; transform: translateX(2px); }
.choice .opt { font-weight: 600; font-size: 17px; line-height: 1.35; }
.choice .turn { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
.go { display: inline-flex; align-items: center; gap: 10px; background: var(--ink); color: var(--sheet); border: 0; border-radius: 3px; padding: 13px 20px; font-family: var(--display); font-weight: 800; font-size: 18px; letter-spacing: 0.08em; text-transform: uppercase; }
.go:hover { background: var(--accent); }
.go.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }
.go.ghost:hover { background: #fff6cf; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* cover */
.cover h1 { font-size: clamp(46px, 11vw, 84px); }
.cover .facts { display: flex; flex-wrap: wrap; gap: 8px 18px; font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 6px 0 22px; }
.cover .facts b { color: var(--ink); font-weight: 800; }

/* phase */
.page.shock { border-top: 6px solid var(--bad); }
.shock-k { color: var(--bad); }
.shocks { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.shocks li { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: baseline; border: 1px solid var(--rule); border-radius: 3px; padding: 10px 14px; }
.pill { font-family: var(--display); font-weight: 800; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; padding: 3px 8px; border-radius: 3px; color: #fff; }
.pill.safe { background: var(--good); } .pill.hit { background: var(--bad); }
.shocks b { font-weight: 600; }
.shocks span.why { grid-column: 2; color: var(--muted); font-size: 15px; }
.mentioned { font-size: 14px; color: var(--muted); border-top: 1px dashed var(--rule); padding-top: 10px; margin: 16px 0 14px; }
.mentioned b { color: var(--ink); font-weight: 600; }
.transcript { list-style: none; margin: 0 0 20px; padding: 0; display: grid; gap: 10px; }
.transcript li { display: grid; grid-template-columns: 92px 1fr; gap: 10px; align-items: baseline; }
.transcript .tag { font-family: var(--display); font-weight: 800; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.transcript li.momentum .tag { color: var(--accent); }
.transcript p { margin: 0; font-size: 17px; }
.transcript li.momentum p { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 15px; }
.transcript li.inject p { background: #fdecea; border-left: 3px solid var(--bad); padding: 8px 12px; }
.transcript li.note { display: block; font-size: 14px; font-style: italic; color: var(--muted); border-top: 1px dashed var(--rule); padding-top: 8px; }
.transcript li.note:first-child { border-top: 0; border-bottom: 1px dashed var(--rule); padding: 0 0 8px; }
@media (max-width: 560px) { .transcript li { grid-template-columns: 1fr; gap: 2px; } }
.charts.void { position: relative; }
.charts.void > div { opacity: 0.4; filter: grayscale(1); }
.stamp { position: absolute; z-index: 1; left: 50%; top: 30%; transform: translate(-50%, -50%) rotate(-8deg); border: 4px solid var(--bad); color: var(--bad); font-family: var(--display); font-weight: 800; font-size: clamp(20px, 5vw, 36px); letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 12px; background: rgba(251, 251, 248, 0.85); white-space: nowrap; }
.cmp.void td { color: var(--muted); }
.phase-no { font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); }

/* finish */
.theend { font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--bad); margin: 0 0 6px; }
.verdict { font-size: 19px; margin: 0 0 20px; }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 0 0 22px; }
.card { border: 1px solid var(--rule); border-radius: 3px; padding: 12px 14px; }
.card .lab { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.card p { margin: 0; font-weight: 600; line-height: 1.35; }
.turned { background: #fdecea; border-left: 3px solid var(--bad); padding: 10px 14px; margin: 0 0 20px; font-size: 16px; }
.sec { font-family: var(--display); font-weight: 800; font-size: 24px; text-transform: uppercase; letter-spacing: 0.02em; margin: 26px 0 4px; }
.sec-sub { color: var(--muted); font-size: 15px; margin: 0 0 12px; }
.charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
.charts svg { width: 100%; height: auto; display: block; }
.chart-cap { font-size: 14px; color: var(--muted); text-align: center; margin: 2px 0 0; }
.key { display: flex; justify-content: center; gap: 16px; font-size: 13px; color: var(--muted); margin-top: 4px; }
.key i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 6px; }
.trail { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.trail li { border: 1px solid var(--rule); border-radius: 3px; padding: 12px 14px; display: grid; gap: 4px; }
.trail .pg { font-family: var(--display); font-weight: 800; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; background: linear-gradient(transparent 55%, var(--mark) 55%); padding: 0 3px; margin-right: 6px; }
.trail .cause { font-weight: 600; }
.trail .then { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.cmp { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 15px; }
.cmp th, .cmp td { text-align: right; padding: 7px 6px; border-bottom: 1px solid var(--rule); }
.cmp th:first-child, .cmp td:first-child { text-align: left; }
.cmp thead th { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.cmp td.you { font-weight: 600; }
.cmp tr.mrow td { border-bottom: 0; padding-bottom: 2px; }
.cmp tr.quip td { text-align: left; font-style: italic; font-size: 14.5px; color: var(--muted); padding-top: 0; padding-bottom: 10px; }
.cmp .hint { display: block; font-size: 12px; color: var(--muted); }
.notes { font-size: 14px; color: var(--muted); border-top: 1px solid var(--rule); margin-top: 26px; padding-top: 14px; }
.copied { font-size: 14px; color: var(--good); }

@media (max-width: 560px) {
  body { font-size: 16px; }
  .page { padding: 18px 16px 22px; margin-right: 8px; box-shadow: 4px 4px 0 -1px var(--sheet), 4px 4px 0 0 var(--rule), 8px 8px 0 -1px var(--sheet), 8px 8px 0 0 var(--rule); }
  .situation, .lede, .verdict { font-size: 18px; }
  .cards, .charts { grid-template-columns: 1fr; }
  .phases li { font-size: 11px; letter-spacing: 0.06em; }
  .phases .lg { display: none; } .phases .sh { display: inline; }
  .pno { font-size: 38px; }
}
@media (max-width: 560px) { .brand small { display: none; } .brand { font-size: 16px; } }
.brand-row { min-width: 0; }
</style>
</head>
<body>
<header class="status" aria-label="Program status">
  <div class="status-in">
    <div class="brand-row"><div class="brand">Project Momentum<small>Albatross Insurance · AI claims assistant</small></div></div>
    <div class="pb"><div class="pb-label">Payback</div><span class="pb-delta" id="pbDelta"></span><span class="pb-val" id="pbVal">2.08 yrs</span></div>
    <div class="hdr-actions"><button class="hdr-toggle" id="hdrToggle" type="button" aria-expanded="true">Hide</button><button class="hdr-toggle" id="restartBtn" type="button">Start again</button></div>
    <div class="track detail" id="track" role="img" aria-label="Payback against the investment limit"><div class="fill" id="fill" style="width:31%"></div><div class="limit" id="limit"><span id="limitLab">Limit</span></div></div>
    <div class="money detail" id="money" hidden>
      <div class="pm-m"><div class="pm-l"><span>Cost vs budget</span><b id="mCost">3.2 / 5.5</b></div><div class="pm-t"><div class="pm-f good" id="mCostF"></div></div></div>
      <div class="pm-m"><div class="pm-l"><span>Savings per year</span><b id="mSave">3.2 / 3.2</b></div><div class="pm-t"><div class="pm-f good" id="mSaveF"></div></div></div>
      <div class="pm-m"><div class="pm-l"><span>Active users</span><b id="mUsers">Not live yet</b></div><div class="pm-t"><div class="pm-f good" id="mUsersF"></div></div></div>
      <div class="pm-m"><div class="pm-l"><span>User satisfaction</span><b id="mSat">Not live yet</b></div><div class="pm-t"><div class="pm-f good" id="mSatF"></div></div></div>
    </div>
    <div class="pm detail" id="pm" hidden>
      <div class="pm-m"><div class="pm-l"><span>Team capacity</span><b id="pmTeam">70</b></div><div class="pm-t"><div class="pm-f good" id="pmTeamF"></div></div></div>
      <div class="pm-m"><div class="pm-l"><span>Risk exposure</span><b id="pmRisk">Low</b></div><div class="pm-t"><div class="pm-f risk" id="pmRiskF"></div></div></div>
    </div>
    <ol class="phases detail" id="phases"></ol>
    <p class="pm-lock detail" id="pmLock">Finish the game once to unlock the program manager dashboard</p>
    <button class="pm-toggle detail" id="pmToggle" type="button" hidden aria-pressed="false">Show program manager dashboard</button>
  </div>
</header>
<div class="scene" id="scene" aria-hidden="true"></div>
<main>
  <div id="stage"></div>
</main>
<script>
/* Scale Up!: content and engine. Pure data + pure functions, shared by the page and the simulator. */
(function (root) {
  'use strict';

  const METERS = ['team', 'sponsor', 'knowledge', 'adoption', 'exposure', 'career'];
  const LIMIT = 2.0;       // payback limit at the start of the year
  const CRUNCH_LIMIT = 1.0; // after the investment freeze
  const BURN = 0.08;
  const CREDIT_PILOT = 0.66; // share of forecast savings finance counts until the rollout proves them        // CHF m of team cost per month of delay

  const PEOPLE = {
    victor: { first: 'Victor', last: 'Mandate', name: 'Victor Mandate', role: 'COO, your sponsor', ini: 'VM', hue: 220 },
    penny: { first: 'Penny', last: 'Capex', name: 'Penny Capex', role: 'CFO', ini: 'PC', hue: 150 },
    ada: { first: 'Ada', last: 'Overfit', name: 'Dr Ada Overfit', role: 'Lead data scientist', ini: 'AO', hue: 280 },
    clara: { first: 'Clara', last: 'Consent', name: 'Clara Consent', role: 'Data protection officer', ini: 'CC', hue: 0 },

<script>
(function () {
  'use strict';
  const G = window.PilotGame;
  const STATS = {"runs": 50000, "avg": {"business": 52, "team": 51.31, "sponsor": 40.43, "knowledge": 59.57, "adoption": 40.38, "compliance": 71.11, "payback": 1.84, "career": 35.35}, "best": {"business": 100, "team": 95, "sponsor": 80, "knowledge": 100, "adoption": 85, "compliance": 100, "payback": 0.5107142857142857, "career": 100}, "endings": {"rolledback": 4404, "fraud": 16503, "empty": 7416, "dignity": 4247, "schrodinger": 1504, "eternal": 9299, "shipped": 983, "paper": 2318, "switchedoff": 1025, "overbudget": 1698, "regulator": 51, "slow": 552}};
  const steps = G.flow();
  const stage = document.getElementById('stage');
  const MIN = 0.5, MAX = 2.5;
  const SHORT = ['Kick-off', 'Pilot', 'Scale', 'Rollout', 'Year end'];
  const FULLPATH = G.DECISIONS.filter((d) => !d.when || d.when({ approved: true })).length;
  function totalDecisions() { return phaseNow < 4 ? FULLPATH : G.DECISIONS.filter((d) => G.applies(d, s)).length; }
  let si = 0, s = G.newState(), queue = [], cur = { k: 'title' }, phaseNow = 0;

  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const yrs = (v) => v.toFixed(2) + ' yrs';

  function avatar(who) {
    const p = G.PEOPLE[who];
    if (who === 'coffee') return '<span class="av" style="--h:40" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h12v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M16 11h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8 3c0 1.5 1 1.5 1 3M12 3c0 1.5 1 1.5 1 3"/></svg></span>';
    return '<span class="av" style="--h:' + p.hue + '" aria-hidden="true">' + p.ini + '</span>';
  }
  function speaker(who) {
    if (!who || who === 'narrator') return '';
    const p = G.PEOPLE[who];
    return '<div class="speaker">' + avatar(who) + '<div class="who"><b>' + esc(p.name) + '</b><span>' + esc(p.role) + '</span></div></div>';
  }
  function saysList(says) {
    return '<ul class="says">' + says.map((x) => x.who === 'narrator'
      ? '<li class="narr"><p>' + esc(x.text) + '</p></li>'
      : '<li>' + speaker(x.who) + '<p>' + esc(x.text) + '</p></li>').join('') + '</ul>';
  }
  function folio(left, right, word) {
    return '<div class="folio"><span class="pno' + (word ? ' word' : '') + '">' + esc(left) + '</span><span class="when">' + esc(right) + '</span></div>';
  }
  function phaseLabel(p) { const ph = G.PHASES[p - 1]; return ph ? ph.name + ' · ' + ph.months : ''; }

  // ---------- status strip ----------
  function renderPhases() {
    document.getElementById('phases').innerHTML = G.PHASES.map((ph) =>
      '<li class="' + (ph.id < phaseNow ? 'done' : ph.id === phaseNow ? 'now' : '') + '"><span class="lg">' + esc(ph.name) + '</span><span class="sh">' + esc(SHORT[ph.id - 1]) + '</span></li>').join('');
  }
  // Program manager view: two extra gauges, unlocked after one finished game, switchable.
  const store = {
    get(k) { try { return window.localStorage.getItem('pilotgame.' + k); } catch (e) { return null; } },
    set(k, v) { try { window.localStorage.setItem('pilotgame.' + k, v); } catch (e) { /* storage unavailable */ } }
  };
  let pmUnlocked = store.get('pmUnlocked') === '1', pmOn = store.get('pmOn') === '1';
  function renderPM() {
    const btn = document.getElementById('pmToggle'), box = document.getElementById('pm');
    btn.hidden = !pmUnlocked;
    btn.textContent = pmOn ? 'Hide program manager dashboard' : 'Show program manager dashboard';
    btn.setAttribute('aria-pressed', pmOn ? 'true' : 'false');
    box.hidden = !(pmUnlocked && pmOn);
    document.getElementById('money').hidden = !(pmUnlocked && pmOn);
    document.getElementById('pmLock').hidden = pmUnlocked;
    const team = Math.round(s.m.team), risk = Math.round(s.m.exposure);
    document.getElementById('pmTeam').textContent = team;
    const tf = document.getElementById('pmTeamF');
    tf.style.width = Math.max(3, team) + '%';
    tf.className = 'pm-f good' + (team < 40 ? ' low' : team < 60 ? ' mid' : '');
    const rf = document.getElementById('pmRisk');
    rf.textContent = risk >= 50 ? 'High' : risk >= 25 ? 'Medium' : 'Low';
    const rff = document.getElementById('pmRiskF');
    rff.style.width = Math.max(3, risk) + '%';
    rff.className = 'pm-f risk' + (risk >= 50 ? ' high' : risk >= 25 ? ' mid' : '');
  }
  let compact = store.get('compact') === '1';
  function renderCompact() {
    document.querySelector('.status').classList.toggle('compact', compact);
    const b = document.getElementById('hdrToggle');
    b.textContent = compact ? 'Show details' : 'Hide';
    b.setAttribute('aria-expanded', compact ? 'false' : 'true');
  }
  document.getElementById('hdrToggle').addEventListener('click', () => { compact = !compact; store.set('compact', compact ? '1' : '0'); renderCompact(); });
  renderCompact();
  // Start again: a second tap within a few seconds confirms, so a stray tap doesn't wipe the game.
  let restartArmed = null;
  document.getElementById('restartBtn').addEventListener('click', () => {
    const b = document.getElementById('restartBtn');
    if (cur.k === 'title') return;
    if (restartArmed) {
      clearTimeout(restartArmed); restartArmed = null;
      b.textContent = 'Start again'; b.classList.remove('confirm');
      restart();
      return;
    }
    b.textContent = 'Tap again to restart'; b.classList.add('confirm');
    restartArmed = setTimeout(() => { restartArmed = null; b.textContent = 'Start again'; b.classList.remove('confirm'); }, 4000);
  });
  document.getElementById('pmToggle').addEventListener('click', () => { pmOn = !pmOn; store.set('pmOn', pmOn ? '1' : '0'); renderPM(); });
  function renderMoney() {
    const c = s.cost, b = s.budget, sv = s.benefit, pr = s.promised;
    document.getElementById('mCost').textContent = 'CHF ' + c.toFixed(2) + 'm of ' + b.toFixed(1) + 'm';
    const cf = document.getElementById('mCostF');
    cf.style.width = Math.min(100, (c / b) * 100) + '%';
    cf.className = 'pm-f good' + (c > b ? ' low' : c > b * 0.9 ? ' mid' : '');
    document.getElementById('mSave').textContent = 'CHF ' + sv.toFixed(1) + 'm of ' + pr.toFixed(1) + 'm';
    const sf = document.getElementById('mSaveF');
    sf.style.width = Math.max(3, Math.min(100, (sv / pr) * 100)) + '%';
    sf.className = 'pm-f good' + (sv < pr * 0.75 ? ' low' : sv < pr * 0.95 ? ' mid' : '');
    const uf = document.getElementById('mUsersF'), tf = document.getElementById('mSatF');
    if (!s.reach) {
      document.getElementById('mUsers').textContent = 'Not live yet';
      document.getElementById('mSat').textContent = 'Not live yet';
      uf.style.width = '0%'; tf.style.width = '0%';
    } else {
      const a = s.m.adoption, active = Math.round(s.reach * a / 100), sat = 1 + a / 25;
      document.getElementById('mUsers').textContent = active + ' of ' + s.reach;
      uf.style.width = Math.max(3, (active / 500) * 100) + '%';
      uf.className = 'pm-f good' + (a < 40 ? ' low' : a < 60 ? ' mid' : '');
      document.getElementById('mSat').textContent = sat.toFixed(1) + ' out of 5';
      tf.style.width = Math.max(3, a) + '%';
      tf.className = 'pm-f good' + (sat < 2.6 ? ' low' : sat < 3.4 ? ' mid' : '');
    }
  }
  let deltaTimer = null;
  function renderGauge(delta) {
    renderPM();
    const pb = G.payback(s);
    const val = document.getElementById('pbVal'), fill = document.getElementById('fill'), track = document.getElementById('track');
    const pct = Math.max(2, Math.min(100, ((pb - MIN) / (MAX - MIN)) * 100));
    document.getElementById('limit').style.left = ((s.limit - MIN) / (MAX - MIN)) * 100 + '%';
    document.getElementById('limitLab').textContent = 'Limit ' + s.limit.toFixed(1) + ' yrs';
    renderMoney();
    document.querySelector('.pb-label').textContent = 'Payback' + ((s.credit || 1) < 1 ? ' · risk-weighted' : '') + (s.flags.RUNBUDGET ? ' · off the books' : '');
    {
      val.textContent = yrs(pb); val.classList.remove('na'); track.classList.remove('na');
      fill.style.width = pct + '%';
      fill.classList.toggle('warn', pb > s.limit - 0.15 && pb <= s.limit);
      fill.classList.toggle('bad', pb > s.limit);
      track.setAttribute('aria-label', 'Payback ' + pb.toFixed(2) + ' years against the ' + s.limit.toFixed(1) + ' year limit');
    }
    const d = document.getElementById('pbDelta');
    if (delta && Math.abs(delta) >= 0.005) {
      d.textContent = (delta > 0 ? '+' : '-') + Math.abs(delta).toFixed(2);
      d.className = 'pb-delta show ' + (delta > 0 ? 'up' : 'down');
      clearTimeout(deltaTimer);
      deltaTimer = setTimeout(() => { d.className = 'pb-delta'; }, 2600);
    }
  }

  // ---------- flow ----------
  let sceneNow = -1;
  function setScene() {
    const n = cur.k === 'finish' ? 5 : phaseNow;
    if (n === sceneNow) return;
    sceneNow = n;
    document.getElementById('scene').innerHTML = window.PilotScenes ? window.PilotScenes.scene(n) : '';
  }
  function show(screen) {
    cur = screen;
    setScene();
    render();
    window.scrollTo({ top: 0 });
    const h = stage.querySelector('[data-focus]');
    if (h) h.focus({ preventScroll: true });
  }
  function next() {
    if (queue.length) { show(queue.shift()); return; }
    si += 1;
    if (s.flags.FRAUD && steps[si] && steps[si].t !== 'finish') si = steps.length - 1;
    run();
  }
  function run() {
    const st = steps[si];
    if (!st) return;
    if (st.t === 'title' || st.t === 'setup') return show({ k: st.t });
    if (st.t === 'phase') {
      phaseNow = st.p; renderPhases();
      let extra = [];
      queue = [];
      if (steps[si + 1] && steps[si + 1].t === 'start') {
        si += 1;
        const before = G.payback(s);
        const grouped = group(G.phaseStart(s, st.p), st.p);
        renderGauge(G.payback(s) - before);
        extra = grouped.plain;
        queue = grouped.shocks;
      }
      return show({ k: 'phase', p: st.p, says: extra });
    }
    if (st.t === 'start' || st.t === 'end') {
      const before = G.payback(s);
      const grouped = group(st.t === 'start' ? G.phaseStart(s, st.p) : G.phaseEnd(s, st.p), st.p);
      renderGauge(G.payback(s) - before);
      queue = (grouped.plain.length ? [{ k: 'event', p: st.p, says: grouped.plain }] : []).concat(grouped.shocks);
      return next();
    }
    if (st.t === 'decision') {
      const d = G.DECISIONS.find((x) => x.id === st.id);
      if (!G.applies(d, s)) { si += 1; return run(); }
      const rd = G.resolveDecision(d, s);
      const before = G.payback(s);
      const skipped = G.skipDecision(s, rd);
      if (skipped) { renderGauge(G.payback(s) - before); return show({ k: 'event', p: rd.phase, says: skipped, page: rd.page }); }
      return show({ k: 'decision', id: st.id });
    }
    if (st.t === 'finish') {
      G.finish(s);
      const firstUnlock = !pmUnlocked;
      pmUnlocked = true; store.set('pmUnlocked', '1');
      if (firstUnlock) { pmOn = true; store.set('pmOn', '1'); }
      renderGauge(0);
      return show({ k: 'finish', firstUnlock: firstUnlock });
    }
  }
  // Ordinary events share one "Meanwhile" page; each shock gets its own page.
  function group(ev, p) {
    const plain = [], shocks = [];
    ev.forEach((e) => { if (e.title) shocks.push({ k: 'event', p: p, says: e.says, title: e.title, kicker: e.kicker, kind: e.kind, call: e.call }); else plain.push.apply(plain, e.says); });
    return { plain: plain, shocks: shocks };
  }
  function pick(i) {
    const d = G.DECISIONS.find((x) => x.id === cur.id);
    const rd = G.resolveDecision(d, s);
    const res = G.choose(s, rd, i);
    renderGauge(res.delta);
    const page = rd.page + 2 + i;
    if (res.says && res.says.length) { queue = [{ k: 'react', p: rd.phase, says: res.says, page: page }]; }
    next();
  }
  function restart() {
    si = 0; s = G.newState(); queue = []; phaseNow = 0;
    document.getElementById('pbDelta').className = 'pb-delta';
    renderPhases(); renderGauge(0); run();
  }

  // ---------- screens ----------
  function render() {
    let html = '';
    if (cur.k === 'title') {
      html = '<article class="page cover">' + folio('Scale Up!', 'A gamebook in ' + FULLPATH + ' decisions', true) +
        '<p class="kicker">A choose-your-own-adventure for people who run AI projects</p>' +
        '<h1 tabindex="-1" data-focus>Can you take an AI program beyond the pilot?</h1>' +
        '<p class="lede">You are the new program lead of Project MOMENTUM at Albatross Insurance. The first time you play, you see just one number: the payback on the business case. Finish once to unlock the program manager dashboard. Everything else that decides how this ends is tracked in secret, and some of what happens to you is nobody\'s decision at all.</p>' +
        '<div class="facts"><span><b>' + FULLPATH + '</b> decisions</span><span><b>12</b> months</span><span><b>' + Object.keys(G.ENDINGS).length + '</b> endings</span><span><b>3</b> shocks</span></div>' +
        '<div class="row"><button class="go" data-act="next">Begin at page 1</button></div>' +
        '<p class="fine">Built from several real programs. Albatross Insurance and its people are invented, and so are the numbers. Regulations are simplified for play.</p></article>';
    } else if (cur.k === 'setup') {
      html = '<article class="page">' + folio('1', 'Your first day') +
        '<h2 tabindex="-1" data-focus>Welcome to Project MOMENTUM</h2>' +
        '<p class="situation">MOMENTUM is an AI assistant that listens to claims calls, summarizes them and drafts the claim file. The plan: a pilot in one region, then go-live in all five regions by month ' + s.golive + '. The first build is estimated at CHF ' + s.cost.toFixed(2) + 'm, and the business case promises savings of CHF ' + s.benefit.toFixed(1) + 'm a year.</p>' +
        saysList([
          { who: 'penny', text: 'Until the savings are proven at scale, finance only counts two-thirds of them. That puts payback at ' + G.payback(s).toFixed(2) + ' years. The investment committee says no to anything over ' + s.limit.toFixed(1) + ' years. You have CHF ' + s.budget.toFixed(1) + 'm approved for the year, rollout included. Every month of delay costs time and money, so watch the gauge at the top.' },
          { who: 'victor', text: 'Most AI projects never leave the pilot. The ones that do mostly fail during the rollout. Ours will be different. Absolutely...' },
          { who: 'narrator', text: 'The game also keeps a few scores you can\'t see, including one for your career. You will see them at the end.' }
        ]) +
        '<div class="row"><button class="go" data-act="next">Turn to page 2</button></div></article>';
    } else if (cur.k === 'phase') {
      const ph = G.PHASES[cur.p - 1];
      html = '<article class="page">' + folio('Part ' + cur.p, ph.months, true) +
        '<p class="phase-no">Part ' + cur.p + ' of 5</p>' +
        '<h1 tabindex="-1" data-focus>' + esc(ph.name) + '</h1>' +
        '<p class="lede">' + esc(G.phaseText(ph, s)) + '</p>' +
        (G.phaseQuip(ph, s) ? saysList([{ who: 'coffee', text: G.phaseQuip(ph, s) }]) : '') +
        (cur.says && cur.says.length ? '<p class="kicker" style="margin-top:18px">Meanwhile</p>' + saysList(cur.says) : '') +
        '<div class="row"><button class="go" data-act="next">Continue</button></div></article>';
    } else if (cur.k === 'decision') {
      const d = G.DECISIONS.find((x) => x.id === cur.id);
      const rd = G.resolveDecision(d, s);
      html = '<article class="page">' + folio(String(rd.page), phaseLabel(rd.phase)) +
        '<p class="kicker">' + esc(rd.topic || '') + '</p>' +
        speaker(rd.who) +
        '<p class="situation" tabindex="-1" data-focus>' + esc(rd.text) + '</p>' +
        '<ol class="choices">' + rd.options.map((o, i) =>
          '<li><button class="choice" data-pick="' + i + '"><span class="opt">' + esc(o.label) + '</span><span class="turn">Turn to page ' + (rd.page + 2 + i) + '</span></button></li>').join('') +
        '</ol><p class="fine">Decision ' + (Object.keys(s.choices).length + 1) + ' of ' + totalDecisions() + '</p></article>';
    } else if (cur.k === 'react' || cur.k === 'event') {
      const left = cur.k === 'react' ? String(cur.page) : (cur.page ? String(cur.page) : 'Meanwhile');
      if (cur.kind === 'call') {
        html = '<article class="page call">' + folio('Interlude', phaseLabel(cur.p), true) +
          '<p class="kicker">' + esc(cur.kicker) + '</p><h2 tabindex="-1" data-focus>' + esc(cur.title) + '</h2>' +
          '<ol class="transcript">' + cur.call.map((l) => l.who === 'note'
            ? '<li class="note">' + esc(l.text) + '</li>'
            : '<li class="' + l.who + (l.inject ? ' inject' : '') + '"><span class="tag">' + (l.who === 'caller' ? 'Caller' : 'MOMENTUM') + '</span><p>' + esc(l.text) + '</p></li>').join('') + '</ol>' +
          '<div class="row"><button class="go" data-act="next">Turn the page</button></div></article>';
        stage.innerHTML = html; bind(); return;
      }
      if (cur.kind === 'after') {
        html = '<article class="page">' + folio('Interlude', phaseLabel(cur.p), true) +
          '<p class="kicker">' + esc(cur.kicker) + '</p><h2 tabindex="-1" data-focus>' + esc(cur.title) + '</h2>' +
          saysList(cur.says) +
          '<div class="row"><button class="go" data-act="next">Turn the page</button></div></article>';
        stage.innerHTML = html; bind(); return;
      }
      const shockLeft = cur.title ? 'Shock' : left;
      html = '<article class="page' + (cur.title ? ' shock' : '') + '">' + folio(shockLeft, phaseLabel(cur.p), shockLeft === 'Meanwhile' || shockLeft === 'Shock') +
        (cur.title ? '<p class="kicker shock-k">Nobody saw this coming</p><h2>' + esc(cur.title.replace('Shock: ', '')) + '</h2>' : '') +
        '<div tabindex="-1" data-focus>' + saysList(cur.says) + '</div>' +
        '<div class="row"><button class="go" data-act="next">Turn the page</button></div></article>';
    } else if (cur.k === 'finish') {
      html = finishHtml();
    }
    stage.innerHTML = html;
    bind();
  }
  function bind() {
    stage.querySelectorAll('[data-act="next"]').forEach((b) => b.addEventListener('click', next));
    stage.querySelectorAll('[data-pick]').forEach((b) => b.addEventListener('click', () => pick(Number(b.dataset.pick))));
    stage.querySelectorAll('[data-act="again"]').forEach((b) => b.addEventListener('click', restart));
    stage.querySelectorAll('[data-act="copy"]').forEach((b) => b.addEventListener('click', copyResult));
  }

  function finishHtml() {
    const r = s.result, E = G.ENDINGS[r.ending], rad = G.radar(s);
    let h = '<article class="page">' + folio(String(E.page), 'The end') +
      '<p class="theend">The end</p><h1 tabindex="-1" data-focus>' + esc(E.title) + '</h1>' +
      '<p class="verdict">' + esc(E.text) + '</p>';
    if (cur.firstUnlock) h += '<p class="unlock"><b>Program manager dashboard unlocked.</b> Next time you play, the top bar also shows the numbers a program manager watches, from budget to risk. You can switch it off with the button under the phases. Your sponsor\'s attention and your career stay hidden until the end.</p>';
    if (!r.approved && r.scaleReasons.length && !s.flags.FRAUD) h += '<p class="turned"><b>The rollout was never approved</b> at the month 6 scale decision: ' + esc(r.scaleReasons.join('; ')) + '.</p>';
    h += '<div class="cards"><div class="card"><div class="lab">What happens to you</div><p>' + esc(r.career) + '</p></div>' +
      '<div class="card"><div class="lab">What happens to MOMENTUM</div><p>' + esc(r.future) + '</p></div></div>';

    h += '<h3 class="sec">When the shocks hit</h3><p class="sec-sub">Nobody could prevent these. What mattered was how prepared MOMENTUM was.</p>' +
      '<ul class="shocks">' + s.shocks.map((x) => '<li><span class="pill ' + (x.safe ? 'safe">Protected' : 'hit">Hit') + '</span><b>' + esc(x.name) + '</b><span class="why">' + esc(x.why) + '</span></li>').join('') + '</ul>';
    h += '<h3 class="sec">The decisions that shaped your ending</h3><p class="sec-sub">What you chose, and the bill that arrived later.</p>' + trailHtml();

    const failed = !!E.failed;
    h += '<h3 class="sec">' + (failed ? 'What the numbers would have said' : 'What was hidden') + '</h3><p class="sec-sub">' + (failed
      ? 'MOMENTUM was stopped, so none of this counts any more. This is how the business case and the hidden meters looked on the day it was switched off.'
      : s.flags.RUNBUDGET
        ? 'Funded from an operations budget, so this business case never went to the investment committee. It existed anyway.'
        : 'The gauge you watched, and the meters behind it, including the ones you couldn\'t see.') + '</p>' +
      '<div class="charts' + (failed ? ' void' : '') + '">' + (failed ? '<span class="stamp" aria-hidden="true">Program stopped</span>' : '') + '<div>' + gaugeSvg(r.payback, STATS.avg.payback) + '<p class="chart-cap">Payback in years. Lower is better.</p></div>' +
      '<div>' + radarSvg(rad, STATS.avg) + '<div class="key"><span><i style="background:var(--accent)"></i>You</span><span><i style="background:var(--muted)"></i>Average player</span></div></div></div>';

    const rows = [
      ['Payback', yrs(r.payback), yrs(STATS.avg.payback), yrs(STATS.best.payback), 'years, lower is better', quipPayback(r.payback)],
      ['Team', rad.team, STATS.avg.team, STATS.best.team, '', quip(rad.team, [
        'Had your photo on the dartboard. The bullseye was your nose.',
        'Did the work. Conversations stopped when you walked into the kitchen.',
        'Would follow you to the next program. Some of them have already asked.'])],
      ['Sponsor attention', rad.sponsor, STATS.avg.sponsor, STATS.best.sponsor, '', quip(rad.sponsor, [
        'Your sponsor thinks MOMENTUM is a fitness app.',
        'Your sponsor remembers your name, and roughly what you do.',
        'Your sponsor brings up MOMENTUM in board meetings without being asked.'])],
      ['Knowledge', rad.knowledge, STATS.avg.knowledge, STATS.best.knowledge, '', quip(rad.knowledge, [
        'Lives in one engineer\'s head. He is interviewing elsewhere.',
        'Half in the wiki, half in Ada\'s head. Nobody knows which half.',
        'Written down and shared. It would survive anyone leaving, even you.'])],
      ['Adoption', rad.adoption, STATS.avg.adoption, STATS.best.adoption, '', quip(rad.adoption, [
        'The claims handlers found the "hide" button in week one.',
        'Used on Tuesdays, when Bernd from claims operations checks.',
        'The claims handlers would riot if you switched it off.'])],
      ['Compliance', rad.compliance, STATS.avg.compliance, STATS.best.compliance, '100 = no exposure', quip(rad.compliance, [
        'Clara, the data protection officer, has a folder with your name on it. It needs a second folder.',
        'Clara, the data protection officer, has a folder for you. It isn\'t thick yet.',
        'Clara, the data protection officer, has nothing to write down. She finds this unsettling.'])]
    ];
    h += '<h3 class="sec">How you compare</h3><p class="sec-sub">Against ' + STATS.runs.toLocaleString('en-GB') + ' simulated players who chose at random. Meters run from 0 to 100.' + (failed ? ' For the record only.' : '') + '</p>' +
      '<table class="cmp' + (failed ? ' void' : '') + '"><thead><tr><th>Meter</th><th>You</th><th>Average</th><th>Best possible</th></tr></thead><tbody>' +
      rows.map((x) => '<tr class="mrow"><td>' + x[0] + (x[4] ? '<span class="hint">' + x[4] + '</span>' : '') + '</td><td class="you">' + fmt(x[1]) + '</td><td>' + fmt(x[2]) + '</td><td>' + fmt(x[3]) + '</td></tr>' +
        '<tr class="quip"><td colspan="4">' + esc(x[5]) + '</td></tr>').join('') +
      '</tbody></table>';

    h += '<div class="row" style="margin-top:24px"><button class="go" data-act="again">Turn back to page 1</button><button class="go ghost" data-act="copy">Copy my result</button><span class="copied" id="copied" aria-live="polite"></span></div>';
    h += '<div class="notes"><p><b>About this game.</b> Scale Up! is a simulation, built from the experience of several real AI programs. Albatross Insurance and its people are invented, and so is every number. The rules it plays with, from the EU AI Act to audit, are simplified, so read them as prompts for a conversation, not as advice.</p>' +
      '<p>Payback is the total cost divided by the yearly savings: how many years the savings take to repay the money spent. Until the rollout proves the savings, finance counts only two-thirds of them. Every month of delay adds CHF ' + G.BURN.toFixed(2) + 'm of team cost. The average and best scores come from simulated players, not real ones.</p></div></article>';
    return h;
  }
  function quip(v, lines) { return v < 35 ? lines[0] : v < 65 ? lines[1] : lines[2]; }
  function quipPayback(pb) {
    if (pb <= s.limit - 0.12) return 'Penny, the CFO, has framed your spreadsheet.';
    if (pb <= s.limit) return 'Penny, the CFO, nodded. Penny never nods.';
    return 'Penny, the CFO, has started using the word "sunk".';
  }
  function fmt(v) { return typeof v === 'number' ? String(Math.round(v)) : v; }

  function trailHtml() {
    const seen = new Set();
    const items = [];
    s.chains.filter((c) => c.causePage).concat(s.chains.filter((c) => !c.causePage)).forEach((c) => {
      const key = c.cause + '|' + c.effect;
      if (seen.has(key) || items.length >= 3) return;
      seen.add(key); items.push(c);
    });
    if (items.length < 3) {
      s.impacts.slice().sort((a, b) => b.size - a.size).forEach((im) => {
        if (items.length >= 3 || im.size === 0) return;
        if (items.some((c) => c.causePage === im.page)) return;
        items.push({ cause: im.label, causePage: im.page, effect: 'One of your biggest single moves, across team, sponsor, money and time.', when: null });
      });
    }
    return '<ol class="trail">' + items.map((c) =>
      '<li><div class="cause">' + (c.causePage ? '<span class="pg">Page ' + c.causePage + '</span>' : '') + esc(c.cause) + '</div>' +
      '<div class="then">' + (c.when ? 'Later, in ' + esc(c.when) : 'What it did') + '</div>' +
      '<div>' + esc(c.effect) + '</div></li>').join('') + '</ol>';
  }

  function gaugeSvg(pb, avg) {
    const cx = 160, cy = 150, R = 110, ang = (v) => Math.PI * (1 - (Math.max(MIN, Math.min(MAX, v)) - MIN) / (MAX - MIN));
    const pt = (v, r) => [cx + r * Math.cos(ang(v)), cy - r * Math.sin(ang(v))];
    const arc = (a, b, col) => { const p1 = pt(a, R), p2 = pt(b, R); return '<path d="M' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1) + ' A' + R + ' ' + R + ' 0 0 1 ' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1) + '" fill="none" stroke="' + col + '" stroke-width="18"/>'; };
    const tick = (v, lab) => { const a = pt(v, R - 14), b = pt(v, R + 14), t = pt(v, R + 28); return '<line x1="' + a[0].toFixed(1) + '" y1="' + a[1].toFixed(1) + '" x2="' + b[0].toFixed(1) + '" y2="' + b[1].toFixed(1) + '" stroke="var(--ink)" stroke-width="2"/><text x="' + t[0].toFixed(1) + '" y="' + (t[1] + 4).toFixed(1) + '" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="var(--display)" font-weight="600">' + lab + '</text>'; };
    const marker = (v, col, r0, r1) => { const a = pt(v, r0), b = pt(v, r1); return '<line x1="' + a[0].toFixed(1) + '" y1="' + a[1].toFixed(1) + '" x2="' + b[0].toFixed(1) + '" y2="' + b[1].toFixed(1) + '" stroke="' + col + '" stroke-width="4" stroke-linecap="round"/>'; };
    return '<svg viewBox="0 0 320 196" role="img" aria-label="Your payback ' + pb.toFixed(2) + ' years, average player ' + avg.toFixed(2) + ' years, limit ' + s.limit.toFixed(1) + ' years">' +
      arc(MIN, s.limit, 'hsl(150 40% 82%)') + arc(s.limit, MAX, 'hsl(6 70% 86%)') +
      tick(s.limit, 'LIMIT ' + s.limit.toFixed(1)) + tick(MIN, MIN.toFixed(1)) + tick(MAX, MAX.toFixed(1)) +
      marker(avg, 'var(--muted)', R - 20, R + 8) + marker(pb, 'var(--accent)', 30, R + 10) +
      '<circle cx="' + cx + '" cy="' + cy + '" r="6" fill="var(--accent)"/>' +
      '<text x="' + cx + '" y="' + (cy + 34) + '" text-anchor="middle" font-family="var(--display)" font-weight="800" font-size="30" fill="var(--ink)">' + pb.toFixed(2) + ' yrs</text>' +
      '</svg>';
  }

  function radarSvg(rad, avg) {
    const keys = [['business', 'Business case'], ['team', 'Team'], ['sponsor', 'Sponsor'], ['knowledge', 'Knowledge'], ['adoption', 'Adoption'], ['compliance', 'Compliance']];
    const cx = 180, cy = 140, R = 86;
    const pt = (i, v) => { const a = -Math.PI / 2 + (i * 2 * Math.PI) / keys.length; return [cx + (R * v / 100) * Math.cos(a), cy + (R * v / 100) * Math.sin(a)]; };
    const poly = (vals) => vals.map((v, i) => pt(i, v).map((n) => n.toFixed(1)).join(',')).join(' ');
    let g = '';
    [25, 50, 75, 100].forEach((lv) => { g += '<polygon points="' + poly(keys.map(() => lv)) + '" fill="none" stroke="var(--rule)" stroke-width="1"/>'; });
    keys.forEach((k, i) => { const p = pt(i, 100); g += '<line x1="' + cx + '" y1="' + cy + '" x2="' + p[0].toFixed(1) + '" y2="' + p[1].toFixed(1) + '" stroke="var(--rule)"/>'; });
    const labels = keys.map((k, i) => { const p = pt(i, 120); const anchor = Math.abs(p[0] - cx) < 8 ? 'middle' : (p[0] > cx ? 'start' : 'end'); return '<text x="' + p[0].toFixed(1) + '" y="' + (p[1] + 4).toFixed(1) + '" text-anchor="' + anchor + '" font-size="12.5" fill="var(--ink)" font-family="var(--display)" font-weight="600" letter-spacing="0.06em">' + k[1].toUpperCase() + '</text>'; }).join('');
    const you = keys.map((k) => Math.max(3, rad[k[0]])), av = keys.map((k) => Math.max(3, avg[k[0]]));
    const dots = you.map((v, i) => { const p = pt(i, v); return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3.5" fill="var(--accent)"/>'; }).join('');
    const desc = keys.map((k) => k[1] + ' ' + Math.round(rad[k[0]])).join(', ');
    return '<svg viewBox="0 0 360 270" role="img" aria-label="Hidden meters: ' + desc + '">' + g +
      '<polygon points="' + poly(av) + '" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3"/>' +
      '<polygon points="' + poly(you) + '" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="2"/>' + dots + labels + '</svg>';
  }

  function copyResult() {
    const r = s.result, E = G.ENDINGS[r.ending];
    const text = 'I played Scale Up! and got "' + E.title + '". Payback ' + r.payback.toFixed(2) + ' years. Career: ' + r.career;
    const out = document.getElementById('copied');
    try {
      navigator.clipboard.writeText(text).then(() => { out.textContent = 'Copied.'; }, () => { out.textContent = text; });
    } catch (e) { out.textContent = text; }
  }

  // ---------- boot ----------
  function start(data) {
    if (data && data.s && typeof data.si === 'number') {
      s = data.s; si = data.si; queue = data.queue || []; phaseNow = data.phaseNow || 0; cur = data.cur || { k: 'title' };
      renderPhases(); renderGauge(0); setScene(); render();
    } else {
      renderPhases(); renderGauge(0); run();
    }
  }
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
    window.claude.hot.snapshot(() => ({ s: s, si: si, queue: queue, phaseNow: phaseNow, cur: cur }));
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
  else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
</body>
</html>
